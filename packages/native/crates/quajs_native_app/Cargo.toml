[package]
name = "quajs_native_app"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = []
image-decode = ["quajs_wgpu_renderer/image-decode"]
native-window = [
  "image-decode",
  "dep:pollster",
  "dep:wgpu",
  "dep:winit",
  "quajs_wgpu_renderer/real-wgpu-native",
]

[dependencies]
quajs_native_runtime = { path = "../quajs_native_runtime" }
quajs_wgpu_renderer = { path = "../quajs_wgpu_renderer" }
pollster = { version = "0.4.0", optional = true }
serde.workspace = true
serde_json.workspace = true
wgpu = { version = "29.0.3", optional = true, default-features = false, features = ["std", "wgsl"] }
winit = { version = "0.30.12", optional = true }
