shellEmulator: true

trustPolicy: no-downgrade
# Historical transitive releases used by svelte-check and vsce/parse-semver.
# Existing lockfile integrity and npm registry signatures verified 2026-09-23.
# These releases lack provenance; keep exceptions pinned, never exempt package names.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2

packages:
  - packages/services/*
  - ai/*
  - demo
  - packages/build/*
  - packages/core/*
  - packages/editor/*
  - '!packages/editor/release'
  - packages/game/*
  - packages/native/*
  - packages/platform/*
  - packages/plugins/*
  - packages/render/*
  - packages/utils
  - packages/utils/*

allowBuilds:
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  electron: true
  keytar: true
  lzma-native: true
  node-pty: true

  sharp: true
overrides:
  ajv@>=7.0.0-alpha.0 <9.0.0: 8.20.0
  minimatch@<3.1.4: 3.1.4
  qs: 6.15.2
  tmp: 0.2.7
  ws: 8.21.0
  # GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr; keep the worker API on v2.
  tinypool@>=2.0.0 <2.1.2: 2.1.2

  'markdown-it@>=14.0.0 <14.3.3': 14.3.3
  '@babel/types@>=7.0.0 <8.0.0': 7.29.14
  # Security fixes stay on each dependency API major.
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
