<!doctype html>
<html lang="{{lang}}"><meta charset="utf-8"><style>
@font-face { font-family: Nunito; src: url(data:font/woff2;base64,{{font}}) format('woff2'); font-weight: 200 1000; }
* { box-sizing: border-box; } body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fffaf6; color: #40363c; font-family: Nunito, 'PingFang SC', 'Noto Sans CJK SC', 'WenQuanYi Zen Hei', sans-serif; }
.wash { position: absolute; inset: 0; background: radial-gradient(ellipse at 0 0, #f8e0e8, transparent 65%), radial-gradient(ellipse at 100% 80%, #e4f1e6, transparent 60%); }
.frame { position: absolute; inset: 24px; border: 1px solid #eadbd8; border-radius: 28px; }
.copy { position: absolute; top: 64px; left: 70px; width: 704px; }
.brand { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
.label { margin: 28px 0 17px; font-size: 16px; font-weight: 800; letter-spacing: 3px; color: #ad4c6c; }
h1 { margin: 0; font-size: 58px; line-height: 1.25; font-weight: 850; letter-spacing: -1.5px; overflow-wrap: anywhere; max-height: 215px; }
.description { margin: 22px 0 0; font-size: 23px; line-height: 1.6; color: #807178; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.art { position: absolute; right: 58px; top: 154px; width: 300px; height: 330px; }

.paper { position: absolute; width: 255px; height: 275px; right: -4px; top: 12px; border-radius: 22px; background: #fffefd; border: 1px solid #eee3de; }
.art img { position: absolute; width: 310px; height: 310px; object-fit: contain; top: 35px; left: -20px; border: 9px solid #fffefd; border-radius: 24px;  }
footer { position: absolute; bottom: 54px; left: 70px; right: 70px; padding-top: 20px; border-top: 1px solid #eadbd8; display: flex; justify-content: space-between; gap: 24px; font-size: 16px; color: #807178; }
footer .route { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 720px; }
</style><body><div class="wash"></div><div class="frame"></div><div class="copy"><div class="brand">QuaEngine</div><p class="label">{{label}}</p><h1>{{title}}</h1><p class="description">{{description}}</p></div><div class="art"><div class="paper"></div><img src="data:image/webp;base64,{{mascot}}" alt=""></div><footer><span class="route">{{route}}</span><span>QUAENGINE.COM</span></footer></body></html>
