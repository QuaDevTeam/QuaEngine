name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.7
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Unity native VM independently of Unity Editor acceptance
        run: |
          cargo fmt --manifest-path packages/platform/unity-host/runtime/Cargo.toml -- --check
          cargo test --locked --manifest-path packages/platform/unity-host/runtime/Cargo.toml
          cargo clippy --locked --manifest-path packages/platform/unity-host/runtime/Cargo.toml --all-targets -- -D warnings

      - name: Run linting
        run: pnpm exec turbo run lint -- --max-warnings=0

      - name: Run type checking
        run: pnpm run typecheck

      - name: Test native scene targets, packaging and shared media contracts
        run: >-
          pnpm exec turbo run test
          --filter=@quajs/assets --filter=@quajs/cocos-host
          --filter=@quajs/store-cocos --filter=@quajs/renderer-cocos
          --filter=@quajs/godot-host --filter=@quajs/renderer-godot
          --filter=@quajs/unity-host --filter=@quajs/renderer-unity
          --filter=@quajs/scene-runtime --filter=@quajs/plugin-embedded
          --filter=@quajs/renderer-scene --filter=@quajs/native-contracts
          --filter=@quajs/renderer-web --filter=@quajs/renderer-vue
          --filter=@quajs/plugin-audio --filter=@quajs/plugin-background
          --filter=@quajs/quack --filter=@quajs/script-compiler

      - name: Test demo UI and Creator build lifecycle
        run: pnpm --filter demo test:ui-surfaces

  native-library:
    # Headless ABI/storage acceptance only; visible Cocoa/Metal runs locally with
    # QUA_NATIVE_VISUAL_SMOKE=1 and must not be inferred from this job.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.7
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native resolver public inputs
        run: >-
          pnpm exec turbo run build --filter=@quajs/quack...
          --filter=@quajs/engine-native... --filter=@quajs/assets-native...
          --filter=@quajs/store-native... --filter=@quajs/plugin-embedded...
      - name: Test native library and shared host lifecycle
        run: cargo test --locked --manifest-path packages/native/Cargo.toml -p quajs_native_app --lib --features embedded-sdk
      - name: Test independently linked C consumer and exported module
        run: pnpm --filter @quajs/quack exec vitest run test/native-embedded-project.test.ts
