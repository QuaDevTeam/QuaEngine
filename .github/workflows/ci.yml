name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.7
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm exec turbo run lint -- --max-warnings=0

      - name: Run type checking
        run: pnpm run typecheck

      - name: Test Cocos packaging and shared media contracts
        run: >-
          pnpm exec turbo run test
          --filter=@quajs/assets --filter=@quajs/cocos-host
          --filter=@quajs/store-cocos --filter=@quajs/renderer-cocos
          --filter=@quajs/renderer-web --filter=@quajs/renderer-vue
          --filter=@quajs/plugin-audio --filter=@quajs/plugin-background
          --filter=@quajs/quack --filter=@quajs/script-compiler

      - name: Test demo UI and Creator build lifecycle
        run: pnpm --filter demo test:ui-surfaces
