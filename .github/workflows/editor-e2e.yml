name: Editor E2E

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'demo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/editor-e2e.yml'
  workflow_dispatch:
    inputs:
      native:
        description: Include Native preview and compositor scenarios
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.7
        with:
          version: 12.3.4
          standalone: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the Electron scenarios with renderer coverage
        env:
          INCLUDE_NATIVE: ${{ inputs.native || false }}
        run: |
          suites=(workbench authoring tools preview)
          if [[ "$INCLUDE_NATIVE" == "true" ]]; then suites+=(native); fi
          pnpm run test:editor:e2e --coverage "${suites[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-e2e-results
          path: |
            .codex-tmp/editor-e2e/run-*/results.json
            .codex-tmp/editor-e2e/run-*/renderer-coverage-summary.json
            .codex-tmp/editor-e2e/run-*/*.log
            .codex-tmp/editor-keyboard/settings-*.png
            .codex-tmp/editor-*/failure.png
            .codex-tmp/editor-workbench-smoke/metrics.json
          include-hidden-files: true
