name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'assets/brand/**', 'packages/**/README.md', 'packages/core/engine/docs/**', 'services/plugin-registry/README.md', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'assets/brand/**', 'packages/**/README.md', 'packages/core/engine/docs/**', 'services/plugin-registry/README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.7
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm docs:build
      - run: pnpm --dir docs exec playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: docs
        run: |
          pnpm preview > /tmp/qua-docs-preview.log 2>&1 &
          trap 'kill $!' EXIT
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: quaengine-docs
          path: docs/build
