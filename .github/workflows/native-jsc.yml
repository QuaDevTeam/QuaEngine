name: Native JavaScriptCore

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install JavaScriptCoreGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjavascriptcoregtk-4.1-dev
      - name: Select Rust stable
        run: rustup default stable
      - name: Collect Windows crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'jsc-crash-dumps'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Force $key | Out-Null
          New-ItemProperty $key -Name DumpFolder -PropertyType ExpandString -Value $folder -Force | Out-Null
          New-ItemProperty $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
          New-ItemProperty $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Test JavaScriptCore runtime and module lifecycle
        id: runtime
        run: cargo test --locked --manifest-path packages/native/Cargo.toml -p quajs_native_runtime --features javascriptcore
      - name: Test native host bridge and startup
        run: cargo test --locked --manifest-path packages/native/Cargo.toml -p quajs_native_app --features javascriptcore
      - name: Build Windows window and audio integration
        if: runner.os == 'Windows'
        run: cargo build --locked --manifest-path packages/native/Cargo.toml -p quajs_native_app --features native-window,native-audio-rodio,javascriptcore
      - name: Locate failing Windows runtime test
        if: failure() && runner.os == 'Windows' && steps.runtime.outcome == 'failure'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'procdump'
          $archive = Join-Path $env:RUNNER_TEMP 'procdump.zip'
          Invoke-WebRequest https://download.sysinternals.com/files/Procdump.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $tools
          $exe = Get-ChildItem packages/native/target/debug/deps/quajs_native_runtime-*.exe | Select-Object -First 1
          $folder = Join-Path $env:RUNNER_TEMP 'jsc-crash-dumps'
          & "$tools/procdump64.exe" -accepteula -mm -e -x $folder $exe.FullName --test-threads=1 --nocapture
          $debugger = "${env:ProgramFiles(x86)}/Windows Kits/10/Debuggers/x64/cdb.exe"
          if (Test-Path $debugger) {
            Get-ChildItem "$folder/*.dmp" | ForEach-Object {
              & $debugger -y $exe.DirectoryName -z $_.FullName -c '.ecxr; kv; q'
            }
          }
      - name: Upload Windows crash diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-jsc-crash
          retention-days: 7
          path: |
            ${{ runner.temp }}/jsc-crash-dumps/*.dmp
            packages/native/target/debug/deps/quajs_native_runtime-*.exe
            packages/native/target/debug/deps/quajs_native_runtime-*.pdb
