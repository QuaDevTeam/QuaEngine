schemaVersion: 1
name: Call Me Again Tomorrow Demo
bundleId: dev.quajs.demo.callmetomorrow
version: 0.1.0
home:
  title: 明天，请再一次呼唤我 Demo
  shortName: 明天，请再一次呼唤我
  description: QuaEngine Web and native renderer demo.
  lang: zh-CN
  themeColor: '#050507'
  backgroundColor: '#050507'
  startUrl: /
  scope: /
icons:
  source: public/icon.png
  favicon: public/favicon.png
targets:
  godot:
    enabled: true
    projectDir: dist/godot/workspace
    layout: landscape
    build:
      entry: src/targets/godot/main.ts
      viteConfig: vite.godot.config.ts
      profile: debug
    assetTarget:
      name: godot-demo
      platform: godot
      staticOnly: true
      pipeline:
        video: { format: ogv, rewriteExtension: false, extraArgs: ["-q:v", "9"] }
  cocos:
    enabled: true
    creatorVersion: 3.8.8
    projectDir: dist/cocos/workspace
    layout: landscape
    platforms: [web-desktop, mac]
    build:
      entry: src/targets/cocos/main.ts
      viteConfig: vite.cocos.config.ts
      macOSDeploymentTarget: '12.0'
    assetTarget:
      name: cocos-demo
      platform: cocos
      staticOnly: true
      pipeline:
        images: { format: png, rewriteExtension: false, optimize: false }
        characters: { format: png, rewriteExtension: false, optimize: false }
      cocos:
        staticOnly: true
        hybrid:
          enabled: true
          resourceRoot: assets
          assetBundle: resources
          domains:
            images: cocos-bundle
            characters: cocos-bundle
            audio: cocos-bundle
            video: cocos-bundle
            fonts: cocos-bundle
    buildOptions:
      debug: true
  web:
    enabled: true
    layout: landscape
    devices:
      desktop: true
      pad: true
      phone: true
    pwa:
      enabled: false
      serviceWorker: generated
  native:
    enabled: true
    platforms:
      - macos
      - windows
      - linux
    profiles:
      - debug
      - release
    layout: landscape
    outputDir: dist/native
    app:
      bundleId: dev.quajs.demo.callmetomorrow
      version: 0.1.0
      buildNumber: '1'
      icon: public/icon.png
    distribution:
      macos:
        minimumSystemVersion: '11.0'
        signing:
          mode: adhoc
        notarization:
          enabled: false
    build:
      cargoManifest: ../packages/native/Cargo.toml
      viteConfig: vite.native-jsc.config.ts
      appAsset: assets/scripts/native-app.mjs
      cargoFeatures:
        - native-window
        - native-audio-rodio
        - javascriptcore
